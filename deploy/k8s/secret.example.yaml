  CHAT_EXPORT_ADMIN_PASS: changeme-replace-me
  CHAT_EXPORT_MCP_TOKEN: cem_replace_me
  CHAT_EXPORT_BROWSER_TOKENS: b-main:ceb_replace_me:Chrome Main
