services:
  server:
    build: .
    image: chat-export-server:local
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - .env
    environment:
      CHAT_EXPORT_HOME: /data
      CHAT_EXPORT_HOST: 0.0.0.0
      CHAT_EXPORT_PORT: "8765"
    volumes:
      - chat-export-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8765/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  chat-export-data:
