name: Publish OCI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Image tag (semver without v)
        required: true
        default: "1.0.4"

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TAG="${TAG#v}"
          else
            TAG="${{ inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/svergio/chat-export-server:${{ steps.ver.outputs.tag }}
            ghcr.io/svergio/chat-export-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/svergio/chat-export-server
            org.opencontainers.image.description=Local MCP server for Chat Export Chrome extension
            io.modelcontextprotocol.server.name=io.github.svergio/chat-export-server
